services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marmoteiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marmoteiro}
      POSTGRES_DB: ${POSTGRES_DB:-marmoteiro}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marmoteiro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marmoteiro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marmoteiro-postgres-data:
